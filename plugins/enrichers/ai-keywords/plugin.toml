# An AI tokenizer: for each new or changed document in the listed
# tessellations, asks the lattice's AI provider for the document's keywords
# and named entities and stores them in a `keywords` field. A text index on
# `keywords` (or on your text fields plus `keywords`) then finds documents by
# concepts and synonyms their text doesn't literally contain.
#
# It runs beside the database, not inside a commit: writes are never slowed
# down, and keywords appear a moment after a document is saved. Documents it
# has already enriched (same text) are skipped, so its own updates don't loop.
#
# Setup: configure an AI provider (Configuration page or `hexdb config set
# ai.provider ...` and `ai.api_key`), list the tessellations and fields, and
# enable the plugin. Calls go through HexDB (`ai = true` below), so they use
# the lattice's key and count against its monthly token budget. No npm
# install needed.
id = "@enrichers/ai-keywords"
name = "AI keywords"
type = "stream"
version = "1.0.0"
description = "Adds AI-extracted keywords and entities to documents, for full-text search."
command = ["node", "index.mjs"]
tessellations = ["articles"]

[access]
role = "writer"
tessellations = ["articles"]
ai = true

[env]
TEXT_FIELDS = "title,body"       # fields to read
KEYWORDS_FIELD = "keywords"      # field to write
MAX_KEYWORDS = "12"

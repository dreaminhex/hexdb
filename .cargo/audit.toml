# cargo audit configuration (CI runs `cargo audit --deny warnings`).
[advisories]
ignore = [
    # paste: unmaintained, not vulnerable. A compile-time macro crate used only
    # by lofty (audio tag extraction). Revisit when lofty drops it.
    "RUSTSEC-2024-0436",
    # rsa 0.10 (Marvin attack: timing side channel in RSA *decryption* with a private
    # key). Only YARA-X uses it, to verify Authenticode signatures in its pe module:
    # public keys only (RsaPublicKey, Pkcs1v15Sign verification), no decryption, so
    # the attack doesn't apply. rsa 0.10.0 (stable) is patched, but yara-x 1.23 doesn't
    # build with it (it imports rsa::Pkcs1v15Sign, gone in 0.10.0); checked 2026-11-16.
    # Owner: HexDB maintainers. Review by 2027-01-31, or as soon as a yara-x release
    # accepts rsa 0.10.0, then drop this line.
    "RUSTSEC-2023-0071",
    # bincode: unmaintained, not vulnerable. YARA-X uses it to serialize its compiled
    # rules in memory; HexDB never decodes untrusted bincode with it.
    "RUSTSEC-2025-0141",
    # chrono: unmaintained (2026-09-14), not vulnerable; no patched version exists.
    # HexDB's own code moved to jiff in 2.6; chrono remains only via nom-exif (EXIF
    # parsing). Owner: HexDB maintainers. Review by 2027-03-31.
    "RUSTSEC-2026-0543",
]

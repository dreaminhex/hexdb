[package]
name = "hexdb"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
shellexpand = "3.1.1"
serde_json = "1.0.140"
toml = "0.8.22"
hexdb_core = { path = "../hexdb_core" }
windows-sys = { version = "0.59.0", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

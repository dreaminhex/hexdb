# clamd configuration for scanning HexDB uploads (files.scan.clamd), for the
# official clamav/clamav image: mount it as /etc/clamav/clamd.conf.
#
# The limits matter. By default clamd scans only the first 100 MB of a file
# (MaxFileSize) and 400 MB of an archive's contents (MaxScanSize), and answers
# "clean" for the rest; and it refuses streams over 25 MB (StreamMaxLength).
# These match HexDB's files.scan.max_size_mb (2000): HexDB records larger files
# as "not scanned" instead of sending them.

Foreground yes
LogTime yes
LogVerbose no
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
DatabaseDirectory /var/lib/clamav

# What HexDB sends and what clamd looks at.
StreamMaxLength 2000M
MaxFileSize 2000M
MaxScanSize 4000M
# Seconds clamd may spend on one file (as files.scan.timeout_seconds, 300): over it,
# AlertExceedsMax would report the file instead of passing it.
MaxScanTime 300000
# Archives inside archives, and the files in them.
MaxRecursion 17
MaxFiles 10000
# A file clamd couldn't fully check (over a limit, encrypted, malformed) is
# reported, not passed: HexDB quarantines it for an administrator to review.
AlertExceedsMax yes
AlertBrokenExecutables yes
AlertEncryptedArchive no
AlertEncryptedDoc no

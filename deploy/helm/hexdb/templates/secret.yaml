{{- if not .Values.existingSecret }}
{{- $name := include "hexdb.fullname" . }}
{{- /* Keep the keys of an existing install: new ones would make the data unreadable. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := printf "base64:%s" (randBytes 32) }}
{{- $lattice := printf "base64:%s" (randBytes 32) }}
{{- /* The first administrator's password: given, kept from the install, or generated here,
     so HexDB never has to generate one and print it to the pod's log. */}}
{{- $admin := .Values.admin.password | default (randAlphaNum 24) }}
{{- if $existing }}
{{- $key = index $existing.data "encryption-key" | b64dec }}
{{- $lattice = index $existing.data "lattice-secret" | b64dec }}
{{- if and (not .Values.admin.password) (hasKey $existing.data "admin-password") }}
{{- $admin = index $existing.data "admin-password" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hexdb.labels" . | nindent 4 }}
  annotations:
    # Deleting the release must not delete the keys the data is encrypted with.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  encryption-key: {{ $key | quote }}
  lattice-secret: {{ $lattice | quote }}
  admin-password: {{ $admin | quote }}
{{- end }}

{{- if not .Values.existingSecret }}
{{- $name := include "hexdb.fullname" . }}
{{- /* Keep the keys of an existing install: new ones would make the data unreadable. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := printf "base64:%s" (randBytes 32) }}
{{- $lattice := printf "base64:%s" (randBytes 32) }}
{{- if $existing }}
{{- $key = index $existing.data "encryption-key" | b64dec }}
{{- $lattice = index $existing.data "lattice-secret" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hexdb.labels" . | nindent 4 }}
  annotations:
    # Deleting the release must not delete the keys the data is encrypted with.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  encryption-key: {{ $key | quote }}
  lattice-secret: {{ $lattice | quote }}
  {{- with .Values.admin.password }}
  admin-password: {{ . | quote }}
  {{- end }}
{{- end }}

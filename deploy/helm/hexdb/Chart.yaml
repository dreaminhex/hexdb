apiVersion: v2
name: hexdb
description: HexDB, an encrypted, replicated document and file database in one binary, as a single hex or a lattice of hexes.
type: application
# Set to the release's version when the chart is published (see .github/workflows/release.yml).
version: 2.2.0
appVersion: "2.2.0"
home: https://hexdb.app
sources:
  - https://github.com/dreaminhex/hexdb
icon: https://hexdb.app/icon-512.png
keywords:
  - hexdb
  - database
  - document-database
  - vector-search
  - replication
  - mcp
maintainers:
  - name: Dream In Hex
    url: https://hexdb.app
annotations:
  artifacthub.io/license: Apache-2.0
  # What Artifact Hub scans for vulnerabilities. ClamAV's image is upstream's (an optional
  # scanner, clamav.enabled), not ours: whitelisted, so it isn't scanned (its scans failed).
  # The workflow stamps the release's version in place of HEXDB_VERSION.
  artifacthub.io/images: |
    - name: hexdb
      image: ghcr.io/dreaminhex/hexdb:HEXDB_VERSION
    - name: clamav
      image: clamav/clamav:1.5
      whitelisted: true
  artifacthub.io/links: |
    - name: Website
      url: https://hexdb.app
    - name: Manual
      url: https://github.com/dreaminhex/hexdb/blob/main/MANUAL.md

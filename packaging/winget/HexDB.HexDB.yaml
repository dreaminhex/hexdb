        PortableCommandAlias: hexdb
      - RelativeFilePath: hexdb-v1.0.0-x86_64-pc-windows-msvc\hexdb_api.exe
        PortableCommandAlias: hexdb_api
    InstallerUrl: https://github.com/dreaminhex/hexdb/releases/download/v1.0.0/hexdb-v1.0.0-x86_64-pc-windows-msvc.zip
    InstallerSha256: REPLACE_WITH_SHA256_FROM_SHA256SUMS
ManifestType: singleton
ManifestVersion: 1.6.0

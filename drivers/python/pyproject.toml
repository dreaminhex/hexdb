[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hexdb"
version = "1.0.0"
description = "Client for HexDB, the hexagonal document database."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []
authors = [{ name = "Dream In Hex" }]
keywords = ["hexdb", "database", "document", "nosql", "client"]

[project.urls]
Homepage = "https://hexdb-website.vercel.app"
Source = "https://github.com/dreaminhex/hexdb"
Issues = "https://github.com/dreaminhex/hexdb/issues"

[tool.setuptools]
packages = ["hexdb"]

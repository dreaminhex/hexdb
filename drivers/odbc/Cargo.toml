[package]
name = "hexdb_odbc"
version = "0.1.0"
edition = "2021"
publish = false
description = "ODBC driver for HexDB: sends SQL to POST /sql over HTTP."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "0.9.0"
serde_json = "1.0"
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }

[dev-dependencies]
hexdb_tests = { path = "../../hexdb_tests" }
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false }

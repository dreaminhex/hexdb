[package]
name = "hexdb_query"
version = "0.1.0"
edition = "2021"

[dependencies]
hexdb_core = { path = "../hexdb_core" }
async-graphql = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0"
chrono = "0.4.41"
ulid = "1.2.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.37", features = ["full"] }
tempfile = "3"
base64 = "0.22.1"

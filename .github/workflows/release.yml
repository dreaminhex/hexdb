name: Release

# Push a tag like v1.0.0 to build and publish everything. packaging/RELEASING.md
# explains each channel and the one-time setup it needs.
#
# Always, on the GitHub release (with SHA256SUMS):
#   - archives for Linux (x86_64, arm64), macOS (arm64, x86_64) and Windows
#     (x86_64): hexdb_api, the hexdb CLI, the admin UI, the ODBC driver, a
#     sample config, the docs and the license;
#   - hexdb-windows-x64.msi, the Windows installer;
#   - hexdb-macos-universal.dmg, the macOS installer (signed and notarized when
#     the Apple secrets are set);
#   - .deb packages for Debian and Ubuntu (amd64, arm64);
#   - a multi-arch container image on GitHub Container Registry.
# When its secret is set (each job is skipped otherwise):
#   - the APT repository on GitHub Pages     APT_GPG_PRIVATE_KEY (+ APT_GPG_PASSPHRASE)
#   - the Homebrew tap                       HOMEBREW_TAP_TOKEN
#   - Chocolatey                             CHOCOLATEY_API_KEY
#   - winget                                 WINGET_TOKEN
#   - npm, PyPI, NuGet                       NPM_TOKEN, PYPI_TOKEN, NUGET_API_KEY

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: hexdb_admin
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: hexdb_admin/dist

  binaries:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: ui
      # Linux builds link against glibc 2.28 (through zig), so they run on Ubuntu
      # 20.04+, Debian 10+ and RHEL 8+, not only on the runner's own glibc.
      - uses: actions/setup-python@v5
        if: contains(matrix.target, 'linux')
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test -f Cargo.lock || cargo generate-lockfile
          if [[ "$TARGET" == *linux* ]]; then
            pip install cargo-zigbuild ziglang
            cargo zigbuild --release --target "$TARGET.2.28" -p hexdb_api -p hexdb_cli -p hexdb_odbc
          else
            cargo build --release --target "$TARGET" -p hexdb_api -p hexdb_cli -p hexdb_odbc
          fi
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="hexdb-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$name"
          exe=""; [[ "$TARGET" == *windows* ]] && exe=".exe"
          cp "target/$TARGET/release/hexdb_api$exe" "target/$TARGET/release/hexdb$exe" "$name/"
          cp -r ui "$name/ui"
          cp packaging/hexdb.toml "$name/hexdb.toml"
          cp README.md MANUAL.md LICENSE "$name/"
          # The ODBC driver library (and, on Windows, its installer script).
          mkdir -p "$name/odbc"
          case "$TARGET" in
            *windows*) cp "target/$TARGET/release/hexdb_odbc.dll" drivers/odbc/install-windows.ps1 "$name/odbc/" ;;
            *apple*) cp "target/$TARGET/release/libhexdb_odbc.dylib" "$name/odbc/" ;;
            *) cp "target/$TARGET/release/libhexdb_odbc.so" "$name/odbc/" ;;
          esac
          if [ "$ARCHIVE" = zip ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: hexdb-*.${{ matrix.archive }}

  msi:
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64-pc-windows-msvc
          path: dl
      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          Expand-Archive (Get-ChildItem dl\*.zip | Select-Object -First 1).FullName -DestinationPath stage
          $dir = (Get-ChildItem stage -Directory | Select-Object -First 1).FullName
          ./packaging/windows/build-msi.ps1 -Version $env:GITHUB_REF_NAME -StageDir $dir -Out hexdb-windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: hexdb-windows-x64.msi

  dmg:
    needs: binaries
    runs-on: macos-latest
    env:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
      MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*-apple-darwin
          path: dl
          merge-multiple: true
      - name: Import the signing certificates
        if: env.MACOS_CERTS_P12 != ''
        run: |
          echo "$MACOS_CERTS_P12" | base64 --decode > certs.p12
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$kc_pass" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certs.p12 -k build.keychain -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" build.keychain
          rm certs.p12
      - name: Build the DMG
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for f in dl/*.tar.gz; do tar xzf "$f" -C dl; done
          arm="dl/hexdb-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          intel="dl/hexdb-${GITHUB_REF_NAME}-x86_64-apple-darwin"
          bash packaging/macos/build-dmg.sh "$GITHUB_REF_NAME" "$arm" "$intel" hexdb-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: hexdb-macos-universal.dmg

  deb:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: hexdb_admin/dist
      - run: cargo install cargo-deb --locked
      - name: Build the package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test -f Cargo.lock || cargo generate-lockfile
          pip install cargo-zigbuild ziglang
          cargo zigbuild --release --target "$TARGET.2.28" -p hexdb_api -p hexdb_cli -p hexdb_odbc
          cargo deb -p hexdb_api --no-build --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  publish:
    needs: [binaries, msi, dmg, deb]
    runs-on: ubuntu-latest
    steps:
      # Only the release files: the ui artifact is an input, not a download.
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hexdb:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/hexdb:${{ steps.tags.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hexdb:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HexDB: a document database with REST, GraphQL, SQL, replication and an admin UI
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

  apt:
    needs: [deb, publish]
    runs-on: ubuntu-latest
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.APT_GPG_PRIVATE_KEY != ''
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - name: Update the APT repository on the gh-pages branch
        if: env.APT_GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" -u "$key" "$@"; }

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --depth 1 --branch gh-pages "$remote" site 2>/dev/null; then
            mkdir site && git -C site init -b gh-pages && git -C site remote add origin "$remote"
          fi
          cd site
          touch .nojekyll
          pool=apt/pool/main/h/hexdb
          mkdir -p "$pool"
          cp ../debs/*.deb "$pool/"
          # Keep the five newest versions.
          (cd "$pool" && printf '%s\n' hexdb_*.deb | sed -E 's/^hexdb_([^_]+)_.*/\1/' | sort -uV | head -n -5 | while read -r v; do rm -f "hexdb_${v}_"*.deb; done)

          cd apt
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages"
            gzip -9kf "dists/stable/main/binary-$arch/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=HexDB \
            -o APT::FTPArchive::Release::Label=HexDB \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            -o "APT::FTPArchive::Release::Description=HexDB packages" \
            release dists/stable > dists/stable/Release
          sign --clearsign -o dists/stable/InRelease dists/stable/Release
          sign -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --export "$key" > hexdb.gpg
          gpg --armor --export "$key" > hexdb.asc
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "APT repository: HexDB ${GITHUB_REF_NAME}"
          git push origin gh-pages

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
      - name: Update the formula in dreaminhex/homebrew-hexdb
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"; version="${tag#v}"
          gh release download "$tag" -p SHA256SUMS -R "$GITHUB_REPOSITORY"
          sha() { grep " hexdb-$tag-$1.tar.gz\$" SHA256SUMS | cut -d' ' -f1; }
          sed -e "s/^  version \".*\"/  version \"$version\"/" \
              -e "s/SHA256_AARCH64_APPLE_DARWIN/$(sha aarch64-apple-darwin)/" \
              -e "s/SHA256_X86_64_APPLE_DARWIN/$(sha x86_64-apple-darwin)/" \
              -e "s/SHA256_AARCH64_UNKNOWN_LINUX_GNU/$(sha aarch64-unknown-linux-gnu)/" \
              -e "s/SHA256_X86_64_UNKNOWN_LINUX_GNU/$(sha x86_64-unknown-linux-gnu)/" \
              packaging/homebrew/hexdb.rb > hexdb.rb
          if grep -q SHA256_ hexdb.rb; then echo "A checksum is missing from SHA256SUMS" >&2; exit 1; fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-hexdb.git" tap
          mkdir -p tap/Formula
          cp hexdb.rb tap/Formula/hexdb.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hexdb.rb
          git commit -m "hexdb $version" || { echo "The formula is already up to date."; exit 0; }
          git push

  chocolatey:
    needs: publish
    runs-on: windows-latest
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CHOCOLATEY_API_KEY != ''
      - name: Pack and push the Chocolatey package
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME; $version = $tag.TrimStart("v")
          gh release download $tag -p SHA256SUMS -R $env:GITHUB_REPOSITORY
          $sha = ((Select-String -Path SHA256SUMS -Pattern ' hexdb-windows-x64\.msi$').Line -split '\s+')[0]
          if (-not $sha) { throw "hexdb-windows-x64.msi is missing from SHA256SUMS" }
          $nuspec = "packaging/chocolatey/hexdb.nuspec"
          (Get-Content $nuspec -Raw) -replace '<version>[^<]+</version>', "<version>$version</version>" | Set-Content $nuspec -NoNewline
          $install = "packaging/chocolatey/tools/chocolateyinstall.ps1"
          (Get-Content $install -Raw) -replace 'download/v[^/]+/', "download/$tag/" -replace "checksum64     = '[^']*'", "checksum64     = '$sha'" | Set-Content $install -NoNewline
          choco pack $nuspec --outputdirectory out
          choco push "out/hexdb.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

  winget:
    needs: publish
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.WINGET_TOKEN != ''
      - name: Submit to microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME; $version = $tag.TrimStart("v")
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/hexdb-windows-x64.msi"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $known = (Invoke-WebRequest -SkipHttpErrorCheck -UseBasicParsing https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/d/DreamInHex/HexDB).StatusCode -eq 200
          if ($known) {
            ./wingetcreate.exe update DreamInHex.HexDB --version $version --urls $url --submit --token $env:WINGET_TOKEN
          } else {
            # First release: submit the manifests in packaging/winget, filled in.
            gh release download $tag -p SHA256SUMS -R $env:GITHUB_REPOSITORY
            $sha = ((Select-String -Path SHA256SUMS -Pattern ' hexdb-windows-x64\.msi$').Line -split '\s+')[0]
            New-Item -ItemType Directory -Force manifests | Out-Null
            foreach ($f in Get-ChildItem packaging/winget/*.yaml) {
              (Get-Content $f -Raw) -replace 'PackageVersion: .*', "PackageVersion: $version" -replace 'download/v[^/]+/', "download/$tag/" -replace 'tag/v[^\s]+', "tag/$tag" -replace 'REPLACE_WITH_SHA256_OF_THE_MSI', $sha.ToUpper() | Set-Content "manifests/$($f.Name)" -NoNewline
            }
            ./wingetcreate.exe submit --token $env:WINGET_TOKEN manifests
          }
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed ($LASTEXITCODE)" }

  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish hexdb to npm
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: drivers/node
        run: npm ci && npm run build && npm publish --access public

  pypi:
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.TWINE_PASSWORD != ''
      - uses: actions/setup-python@v5
        if: env.TWINE_PASSWORD != ''
        with:
          python-version: "3.12"
      - name: Publish hexdb to PyPI
        if: env.TWINE_PASSWORD != ''
        working-directory: drivers/python
        run: pip install build twine && python -m build && twine upload --skip-existing dist/*

  nuget:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY || secrets.NUGET_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.NUGET_API_KEY != ''
      - uses: actions/setup-dotnet@v4
        if: env.NUGET_API_KEY != ''
        with:
          dotnet-version: "8.0.x"
      - name: Publish HexDB.Client and HexDB.EntityFrameworkCore to NuGet
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet pack drivers/dotnet/HexDB.Client -c Release -o nupkg
          dotnet pack drivers/dotnet/HexDB.EntityFrameworkCore -c Release -o nupkg
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

name: Docker Hub

# Copies a release's container image from GitHub Container Registry to Docker
# Hub (docker.io/<namespace>/hexdb), every platform at once and without
# rebuilding, and updates the Docker Hub page from docker/README.md. The
# release workflow calls it; run it by hand (Actions > Docker Hub > Run
# workflow) to publish an earlier release. Needs DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN; skipped without them. The namespace is the repository
# variable DOCKERHUB_NAMESPACE, or DOCKERHUB_USERNAME.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, e.g. v2.2.0
        required: true
        type: string
      latest:
        description: Also tag it latest
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, e.g. v2.2.0
        required: true
        type: string
      latest:
        description: Also tag it latest (only for the newest release)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/setup-buildx-action@v4
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the image (all platforms) from GHCR
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          source="ghcr.io/${GITHUB_REPOSITORY_OWNER}/hexdb:${TAG}"
          target="docker.io/${NAMESPACE}/hexdb"
          tags=(-t "$target:$TAG" -t "$target:$version")
          if [ "${{ inputs.latest }}" = "true" ]; then
            tags+=(-t "$target:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$source"
          docker buildx imagetools inspect "$target:$version"
      - name: Update the Docker Hub page
        if: env.DOCKERHUB_TOKEN != ''
        # The image is what matters; a page update refused (a token without the Delete scope) only warns.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/hexdb
          short-description: "HexDB: an encrypted, replicated document and file database with REST, GraphQL, SQL, vector search and MCP."
          readme-filepath: docker/README.md

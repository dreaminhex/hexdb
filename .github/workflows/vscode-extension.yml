# Publishes HexDB for VS Code (extensions/vscode) when a vscode-v<version> tag is pushed, e.g.
# vscode-v0.1.1 for "version": "0.1.1" in extensions/vscode/package.json. The extension has its
# own version, apart from HexDB's releases (release.yml runs on v<digit> tags, not these).
#
# Both stores use trusted publishing: each exchanges an OIDC token from this workflow for a
# short-lived credential, so no token is stored anywhere. Both are registered with this file
# (vscode-extension.yml) and the environment open-vsx, which only vscode-v* tags may deploy to
# (neither store checks the ref itself):
#   Open VSX              open-vsx.org, namespace dreaminhex
#   VS Code Marketplace   the Trusted Publishing policy of the publisher DreamInHex, for the
#                         repository dreaminhex/hexdb
#
# The .vsix is also attached to a GitHub release for the tag. Re-running publishes nothing twice.

name: VS Code extension

on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing to both stores
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            drivers/node/package-lock.json
            extensions/vscode/package-lock.json

      - name: The tag matches the extension's version
        working-directory: extensions/vscode
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "vscode-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match extensions/vscode/package.json version $version (expected vscode-v$version)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The extension bundles the JavaScript driver from drivers/node.
      - run: npm ci
        working-directory: drivers/node
      - run: npm ci
        working-directory: extensions/vscode
      - name: Test and package
        working-directory: extensions/vscode
        run: |
          npm test
          npx vsce package --no-dependencies -o "hexdb-$VERSION.vsix"

      - name: Publish to Open VSX
        working-directory: extensions/vscode
        run: npx --yes ovsx@1.3.0 publish -i "hexdb-$VERSION.vsix" --trusted-publishing --skip-duplicate

      - name: Publish to the VS Code Marketplace
        working-directory: extensions/vscode
        run: npx vsce publish -i "hexdb-$VERSION.vsix" --oidc --skip-duplicate

      - name: GitHub release
        working-directory: extensions/vscode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "hexdb-$VERSION.vsix" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "hexdb-$VERSION.vsix" --title "HexDB for VS Code $VERSION" --notes "HexDB for VS Code $VERSION. See extensions/vscode/CHANGELOG.md." --latest=false
          fi

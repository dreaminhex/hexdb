name: Workbench

# HexDB Workbench (workbench/): checked on every change to it; built for Windows,
# macOS and Linux on a workbench-v* tag, signed when the signing secrets exist,
# and published as a prerelease (pilot builds: no auto-update, no store listings).
#
# Signing secrets (each optional; without them the build is unsigned and says so):
#   Windows: WINDOWS_CERT_PFX (base64 PFX) and WINDOWS_CERT_PASSWORD
#   macOS:   MACOS_CERTS_P12, MACOS_CERTS_PASSWORD, MACOS_APP_IDENTITY ("Developer ID
#            Application: ..."), APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (notarization)
#   All:     APT_GPG_PRIVATE_KEY signs SHA256SUMS

on:
  push:
    branches: [main]
    paths: ["workbench/**", ".github/workflows/workbench.yml"]
    tags: ["workbench-v*"]
  pull_request:
    paths: ["workbench/**", ".github/workflows/workbench.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: workbench/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Front end
        working-directory: workbench
        run: npm ci && npm run build
      - name: Clippy and tests
        working-directory: workbench/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/workbench-v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - name: Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $pass = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          Remove-Item cert.pfx
          $conf = Get-Content workbench/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content workbench/src-tauri/tauri.conf.json -Encoding utf8
      - name: macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTS_P12 != ''
        env:
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          echo "$MACOS_CERTS_P12" | base64 --decode > certs.p12
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$kc_pass" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certs.p12 -k build.keychain -P "$MACOS_CERTS_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" build.keychain
          rm certs.p12
      - name: Build
        working-directory: workbench
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
          if [ -z "$WINDOWS_CERT_PFX$MACOS_CERTS_P12" ] && [ "$RUNNER_OS" != "Linux" ]; then
            echo "::warning::Built unsigned: the signing secrets aren't set."
          fi
      - name: Collect
        shell: bash
        run: |
          mkdir out
          find workbench/src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workbench-${{ runner.os }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: workbench-*
          path: out
          merge-multiple: true
      - name: Checksums
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            gpg --batch --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: HexDB Workbench ${{ github.ref_name }} (pilot)
          prerelease: true
          body: |
            HexDB Workbench, a pilot build: named, color-coded environments, the lattice's admin UI in its own window, SSH tunnels with host-key checks, API keys in the OS keychain, and schema and index compare. See workbench/README.md. No auto-update yet.
          files: out/*

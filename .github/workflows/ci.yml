name: CI

on:
  push:
    branches: [main, 'features/**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: 64-bit ARM (the same architecture as a Raspberry Pi 4 or 5).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        shell: bash
        env:
          # Keep each test server's folder (logs) under a known path, for the artifact below.
          HEXDB_TEST_KEEP: "1"
          HEXDB_TEST_DIR: ${{ runner.temp }}/hexdb-tests
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: Keep the test servers' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/hexdb-tests/*/server.log
            ${{ runner.temp }}/hexdb-tests/*/test.txt
          retention-days: 7
      - name: Summarize test failures
        if: failure()
        shell: bash
        # One annotation per failing test, with its panic message, so failures
        # show on the run's summary without opening the log.
        run: |
          grep -E '^---- .* stdout ----$' test-output.txt | sed -E 's/^---- (.*) stdout ----$/\1/' | while read -r name; do
            detail=$(awk -v t="---- $name stdout ----" '$0==t{f=1;next} f&&/^---- /{exit} f' test-output.txt | grep -m1 -A3 'panicked at' | tr '\n' ' ' | cut -c1-900)
            title=$(printf '%s' "$name" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            echo "::error title=Test failed%3A $title::$(printf '%s' "$detail" | sed 's/%/%25/g')"
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit --deny warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdb_admin/package-lock.json
      - name: npm audit
        working-directory: hexdb_admin
        run: npm audit --audit-level=moderate

  drivers:
    name: Drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build the server
        run: |
          cargo build --locked -p hexdb_api
      - name: Node.js
        working-directory: drivers/node
        run: npm install && npm test
      - name: Python
        run: node drivers/testing/server.mjs python -m unittest discover -s drivers/python/tests -t drivers/python -v
      - name: .NET
        run: node drivers/testing/server.mjs dotnet test drivers/dotnet
      - name: ODBC (unixODBC, pyodbc)
        run: |
          sudo apt-get install -y unixodbc
          pip install pyodbc
          cargo build --locked -p hexdb_odbc
          node drivers/testing/server.mjs python drivers/odbc/tests/pyodbc_smoke.py

  odbc-windows:
    name: ODBC (Windows driver manager)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          cargo build --locked -p hexdb_api -p hexdb_odbc
      # Hosted runners are elevated, so the driver can be registered.
      - name: Install the driver
        shell: pwsh
        run: ./drivers/odbc/install-windows.ps1 -Dll target/debug/hexdb_odbc.dll
      - name: pyodbc
        shell: bash
        env:
          HEXDB_ODBC_DRIVER: HexDB
        run: |
          pip install pyodbc
          node drivers/testing/server.mjs python drivers/odbc/tests/pyodbc_smoke.py

  admin-ui:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hexdb_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdb_admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        timeout-minutes: 5

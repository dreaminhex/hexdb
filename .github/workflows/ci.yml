name: CI

on:
  push:
    branches: [main, 'features/**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables only (backtraces keep file and line) and no incremental state: the
  # ~50 test binaries with full debug info filled the runner's disk on a cold build
  # (a Dependabot Cargo update misses the cache).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: 64-bit ARM (the same architecture as a Raspberry Pi 4 or 5).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # OCR and ffmpeg thumbnails are tested where the programs are installed.
      - name: Tesseract and ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng ffmpeg
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        shell: bash
        env:
          # Keep each test server's folder (logs) under a known path, for the artifact below.
          HEXDB_TEST_KEEP: "1"
          HEXDB_TEST_DIR: ${{ runner.temp }}/hexdb-tests
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: Keep the test servers' logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/hexdb-tests/*/server.log
            ${{ runner.temp }}/hexdb-tests/*/test.txt
          retention-days: 7
      - name: Summarize test failures
        if: failure()
        shell: bash
        # One annotation per failing test, with its panic message, so failures
        # show on the run's summary without opening the log.
        run: |
          grep -E '^---- .* stdout ----$' test-output.txt | sed -E 's/^---- (.*) stdout ----$/\1/' | while read -r name; do
            detail=$(awk -v t="---- $name stdout ----" '$0==t{f=1;next} f&&/^---- /{exit} f' test-output.txt | grep -m1 -A3 'panicked at' | tr '\n' ' ' | cut -c1-900)
            title=$(printf '%s' "$name" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            echo "::error title=Test failed%3A $title::$(printf '%s' "$detail" | sed 's/%/%25/g')"
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit --deny warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdb_admin/package-lock.json
      - name: npm audit
        working-directory: hexdb_admin
        run: npm audit --audit-level=moderate
      - name: npm audit (driver, VS Code extension, plugins)
        run: |
          for lock in drivers/node/package-lock.json extensions/vscode/package-lock.json plugins/*/*/package-lock.json; do
            dir=$(dirname "$lock")
            echo "== $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=moderate)
          done

  drivers:
    name: Drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the server
        run: |
          cargo build --locked -p hexdb_api
      - name: Node.js
        working-directory: drivers/node
        run: npm install && npm test
      - name: Plugin SDK
        run: node --test plugins/sdk/hexdb-plugin.test.mjs
      - name: Python
        run: node drivers/testing/server.mjs python -m unittest discover -s drivers/python/tests -t drivers/python -v
      - name: .NET
        run: node drivers/testing/server.mjs dotnet test drivers/dotnet
      - name: JDBC
        run: node drivers/testing/server.mjs mvn -B -f drivers/java test
      - name: ODBC (unixODBC, pyodbc)
        run: |
          sudo apt-get install -y unixodbc
          pip install pyodbc
          cargo build --locked -p hexdb_odbc
          node drivers/testing/server.mjs python drivers/odbc/tests/pyodbc_smoke.py

  odbc-windows:
    name: ODBC (Windows driver manager)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          cargo build --locked -p hexdb_api -p hexdb_odbc
      # Hosted runners are elevated, so the driver can be registered.
      - name: Install the driver
        shell: pwsh
        run: ./drivers/odbc/install-windows.ps1 -Dll target/debug/hexdb_odbc.dll
      - name: pyodbc
        shell: bash
        env:
          HEXDB_ODBC_DRIVER: HexDB
        run: |
          pip install pyodbc
          node drivers/testing/server.mjs python drivers/odbc/tests/pyodbc_smoke.py

  admin-ui:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hexdb_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hexdb_admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        timeout-minutes: 5

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            drivers/node/package-lock.json
            extensions/vscode/package-lock.json
      # The extension bundles the JavaScript driver from drivers/node.
      - run: npm ci
        working-directory: drivers/node
      - run: npm ci
        working-directory: extensions/vscode
      # Type checks, build, unit tests (the integration tests need a desktop VS Code).
      - run: npm test
        working-directory: extensions/vscode

[workspace]
members = [
    "hexdb_core",
    "hexdb_api",
    "hexdb_cli",
    "hexdb_query",
    "hexdb_tests",
    "drivers/odbc",
    "bench"
]
resolver = "2"
# Third-party crates HexDB carries patched copies of (see vendor/VENDORED.md).
exclude = ["vendor/nom-exif"]

[patch.crates-io]
# nom-exif 3.8.0 with chrono (unmaintained, RUSTSEC-2026-0543) replaced by jiff.
nom-exif = { path = "vendor/nom-exif" }

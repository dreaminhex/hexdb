[package]
name = "hexdb_tests"
version = "2.0.0"
license = "Apache-2.0"
edition = "2021"
publish = false
description = "End-to-end tests that run the real hexdb_api server."

[dependencies]
hexdb_core = { path = "../hexdb_core" }
anyhow = "1.0"
serde_json = "1.0.140"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
rcgen = "0.14"

[dev-dependencies]
tokio = { version = "1.37", features = ["full"] }
ulid = "1.2.1"
base64 = "0.22.1"
chrono = "0.4.41"
sha2 = "0.10"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# A WebSocket client for the live-feed tests.
tungstenite = "0.30"
# A gRPC client for the gRPC tests, generated from hexdb_api/proto.
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14.6"
prost = "0.14.4"

[build-dependencies]
tonic-prost-build = { version = "0.14.6", default-features = false, features = ["transport"] }
protox = "0.10.0"

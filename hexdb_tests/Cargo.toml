[package]
name = "hexdb_tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end tests that run the real hexdb_api server."

[dependencies]
hexdb_core = { path = "../hexdb_core" }
anyhow = "1.0"
serde_json = "1.0.140"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1.37", features = ["full"] }
ulid = "1.2.1"
base64 = "0.22.1"
chrono = "0.4.41"

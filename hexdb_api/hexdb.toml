[network]
api_endpoint = "127.0.0.1:7700"
discovery_endpoint = "127.0.0.1:7702"
# lattice_name: hexes with the same name form one lattice. Left out, the first
# start generates a name (saved in the data directory); the admin UI's
# "Add a hex" dialog shows the settings another hex needs to join.

[identity]
role = "auto" # auto | overseer | harvester | replicant

[security]
admin_login = "hexdbadmin"
admin_email = "admin@hexdb.ai"

[memory]
ram_mb = 1024
ttl_scan_frequency = 600
vertex_integrity_check_frequency = 300

[storage]
path = "./.hexdb"
disk_mb = 16384
encryption_key = "" # set in hexdb.local.toml or HEXDB_STORAGE__ENCRYPTION_KEY; generate with: echo "base64:$(openssl rand -base64 32)"
compaction_frequency = 180
wal_sync = true # fsync the WAL before acknowledging writes
wal_flush_check_frequency = 60

[compression]
compression_level = 0

[package]
name = "hexdb_api"
version = "1.0.0"
license = "Apache-2.0"
edition = "2021"
homepage = "https://hexdb-website.vercel.app"
repository = "https://github.com/dreaminhex/hexdb"
description = "HexDB server: a document database with REST, GraphQL, replication and an admin UI"

[dependencies]
hexdb_core = { path = "../hexdb_core" }
hexdb_query = { path = "../hexdb_query" }
async-graphql = "7.0"
tokio = { version = "1.37", features = ["full"] }
axum = "0.8.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
hyper = { version = "1", features = ["server"] }
serde_json = "1.0.140"
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
chrono = "0.4.41"
tower-http = { version = "0.6.4", features = ["fs"] }
ulid = "1.2.1"
futures = "0.3"
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# `cargo deb -p hexdb_api` (after `cargo build --release -p hexdb_cli -p
# hexdb_odbc` and building the admin UI) makes a Debian/Ubuntu package with a
# systemd service and the ODBC driver, registered with unixODBC when present.
[package.metadata.deb]
name = "hexdb"
maintainer = "Dream In Hex <matthew@dreaminhex.com>"
copyright = "2026, Dream In Hex. Apache License 2.0."
license-file = ["../LICENSE", "0"]
extended-description = "HexDB, a document database: the server, the hexdb CLI, the admin UI and the ODBC driver."
section = "database"
priority = "optional"
# Not $auto: the binaries are built against glibc 2.28 (cargo zigbuild) and need
# only libc, libm, libpthread and libdl, but dpkg-shlibdeps on a newer build
# machine would ask for that machine's glibc.
depends = "adduser, libc6 (>= 2.28)"
maintainer-scripts = "../packaging/debian"
conf-files = ["/etc/hexdb/hexdb.toml"]
assets = [
    ["target/release/hexdb_api", "usr/bin/", "755"],
    ["target/release/hexdb", "usr/bin/", "755"],
    ["../packaging/debian/hexdb.toml", "etc/hexdb/hexdb.toml", "644"],
    ["../hexdb_admin/dist/**/*", "usr/share/hexdb/ui/", "644"],
    ["../packaging/systemd/hexdb.service", "lib/systemd/system/hexdb.service", "644"],
    ["target/release/libhexdb_odbc.so", "usr/lib/hexdb/libhexdb_odbc.so", "644"],
    ["../README.md", "usr/share/doc/hexdb/README.md", "644"],
    ["../MANUAL.md", "usr/share/doc/hexdb/MANUAL.md", "644"],
]
